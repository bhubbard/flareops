[package]
name = "flareops"
version = "0.1.0"
edition = "2024"
authors = ["Brandon Hubbard <bhubbard@users.noreply.github.com>"]
description = "Developer experience & workflow CLI for Cloudflare Workers, Pages, and Astro — type generation, secret sync, route optimization, and unified validation."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bhubbard/flareops"
homepage = "https://bhubbard.github.io/flareops"
keywords = ["cloudflare", "workers", "pages", "astro", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[lib]
name = "flareops"
path = "src/lib.rs"

[[bin]]
name = "flareops"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
colored = "3.0"
comfy-table = "7.1"
walkdir = "2.5"
thiserror = "2.0"
anyhow = "1.0"
regex = "1.11"

[dev-dependencies]
tempfile = "3.17"
